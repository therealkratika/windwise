services:
  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          response = urllib.request.urlopen(
          "http://127.0.0.1:8000/api/health", timeout=5);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
